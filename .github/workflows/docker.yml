name: Build, Test and Push Docker Image

on:
  workflow_call:
    inputs:
#      tag:
#        description: 'The tag to use for the Docker image'
#        required: true
#        type: string
#      cache_tag:
#        description: 'The tag to use for cache-from'
#        required: true
#        type: string
#      is_release:
#        description: 'Whether this is a release build'
#        required: false
#        type: boolean
#        default: false
      base_project_name:
        description: 'The base project name'
        required: true
        type: string
      project_name:
        description: 'The project name'
        required: true
        type: string
#      short_sha:
#        description: 'The short SHA of the commit'
#        required: true
#        type: string

jobs:
  build-test-push:
#    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history for better caching/context
          submodules: recursive

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Spack Base image
      - name: Spack Base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-Spack-Base
          push: false
          platforms: linux/amd64
          tags: |
            ${{ inputs.base_project_name }}
          cache-from: |
            type=gha,scope=spack-base
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catchem-spack-base-dev:latest
          cache-to: |
            type=gha,scope=spack-base,mode=max
            type=inline

      # 6. Build CATChem image
      - name: CATChem image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ inputs.base_project_name }}
          tags: ${{ inputs.project_name }}
          cache-from: |
            type=gha,scope=catchem
          cache-to: |
            type=gha,scope=catchem,mode=max
            type=inline
