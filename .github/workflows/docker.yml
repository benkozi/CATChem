name: Build, Test and Push Docker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_tag:
        description: 'The tag to use for the Docker image'
        required: false
        type: string
      cache_tag:
        description: 'The tag to use for cache-from'
        required: false
        type: string

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history for better caching/context
          submodules: recursive

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # 4. Extract metadata
      - name: Extract metadata
        id: meta
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          
          # Determine the tag to use
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "TAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "IS_RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "IS_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Determine the cache tag
          if [ -n "${{ inputs.cache_tag }}" ]; then
            RAW_CACHE_TAG="${{ inputs.cache_tag }}"
            echo "CACHE_TAG=${RAW_CACHE_TAG::7}" >> "$GITHUB_OUTPUT"
          else
            echo "CACHE_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for changes in Spack Base Dockerfile
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'docker/Dockerfile-Spack-Base'

      # 6. Build and push Spack Base image
      - name: Build and push Spack Base image
        if: steps.filter.outputs.base == 'true' || steps.meta.outputs.IS_RELEASE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-Spack-Base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_BASE_PROJECT_NAME }}:${{ steps.meta.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_BASE_PROJECT_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_BASE_PROJECT_NAME }}:latest
          cache-to: type=inline

      # 7. Build and push production image
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_BASE_PROJECT_NAME }}:${{ steps.meta.outputs.TAG }}
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.TAG }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.CACHE_TAG }}
          cache-to: type=inline
