# Deliberately process-free CATChem configuration for the local NUOPC
# lifecycle harness.  The harness verifies a complete coupled DataATM ->
# CATChem -> DataATM initialize/run/finalize cycle without external emission,
# optics, or diagnostic files.  Production process activation remains wholly
# controlled by the configuration selected by the embedding application.
simulation:
  name: nuopc_lifecycle_harness
  start_date: 20210322 0600
  end_date: 20210322 0620
  species_filename: CATChem_species.yml
  emission_filename: CATChem_emission.yml
  # Set true in an embedding configuration to emit per-PET run-phase markers.
  verbose:
    activate: false

grid:
  number_of_levels: 5

timesteps:
  transport_timestep_in_s: 600
  chemistry_timestep_in_s: 600

diagnostics:
  output:
    enabled: false
  collection:
    enabled: false

run_phases:
  lifecycle:
    description: Exercise the CATChem cap with a self-contained sea-salt step.
    processes: [seasalt]

processes:
  seasalt:
    activate: true
    diagnostics: false
    scheme: geos12
  # The NUOPC emissions adapter: one gridded category, anthro, fed by the
  # NUOPC emission imports (field-mapping entries extemis/anthro/<variable>)
  # that the DataATM mock provides; no source_file, so nothing is read from
  # disk and an unconnected import would fail loudly instead of falling back
  # to a file. The other categories of CATChem_emission.yml stay inactive.
  extemis:
    activate: true
    global_diagnostics: false
    anthro:
      activate: true
      scale_factor: 1.0
      format: "netcdf"
      gridded: true
      is_2d: true
      frequency: "hourly"
      time_interpolation: none
      apply_method: add
      vertical_dist: none
      reverse_vertical: false
      diagnostics: false
    # A category of CATChem_emission.yml without a block here is active by
    # default: keep the two climatologies off so only anthro binds.
    gmi:
      activate: false
    dms:
      activate: false
