name: Semantic Release

on:
  workflow_call:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.11.0
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vcs_release: false
          prerelease_branches: ["develop", "feature/container-build"]
