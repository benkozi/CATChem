name: Main CI/CD

on:
  push:
#    branches: [main, develop]
    branches: [feature/container-build, feature/dev-container-build]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  BASE_PROJECT_NAME_DEV: catchem-spack-base-ubuntu-gcc-13-dev
  PROJECT_NAME_DEV: catchem-ubuntu-gcc-13-dev
  BASE_PROJECT_NAME: catchem-spack-base-ubuntu-gcc-13
  PROJECT_NAME: catchem-ubuntu-gcc-13

jobs:
  docker-setup:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  lint:
    uses: ./.github/workflows/lint.yml

  ci-gnu:
    uses: ./.github/workflows/build-and-test.yml

  ci-spack:
    uses: ./.github/workflows/spack-stack.yml

  docker-develop:
    needs: [docker-setup]
    uses: ./.github/workflows/docker.yml
    with:
      short_sha: ${{ needs.docker-setup.outputs.short_sha }}
      base_project_name: ${{ env.BASE_PROJECT_NAME_DEV }}
      project_name: catchem-dev
    secrets: inherit

  release:
    needs: [lint, ci-gnu, ci-spack, docker-develop]
    if: github.event_name == 'push'
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit

  docker-release:
    needs: [docker-setup, release, docker-develop]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      release_version: ${{ needs.release.outputs.new_release_version }}
      base_project_name: ${{ needs.release.outputs.is_prerelease == 'true' && env.BASE_PROJECT_NAME_DEV || env.BASE_PROJECT_NAME }}
      project_name: ${{ needs.release.outputs.is_prerelease == 'true' && env.PROJECT_NAME_DEV || env.PROJECT_NAME }}
    secrets: inherit

  docs:
    needs: [lint, ci-gnu, ci-spack, release, docker-develop]
    uses: ./.github/workflows/docs.yml

  docker-cleanup:
    needs: [docker-setup, docker-develop, docker-release, docs]
    if: always() && needs.docker-develop.result == 'success'
    uses: ./.github/workflows/docker-cleanup.yml
    with:
      short_sha: ${{ needs.docker-setup.outputs.short_sha }}
      base_project_name: ${{ env.BASE_PROJECT_NAME_DEV }}
    secrets: inherit
