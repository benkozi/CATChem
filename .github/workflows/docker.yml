name: Build, Test and Push Docker Image

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to use for the Docker image'
        required: true
        type: string
      cache_tag:
        description: 'The tag to use for cache-from'
        required: true
        type: string
      is_release:
        description: 'Whether this is a release build'
        required: false
        type: boolean
        default: false
      base_project_name:
        description: 'The base project name'
        required: true
        type: string
      project_name:
        description: 'The project name'
        required: true
        type: string

jobs:
  build-test-push:
#    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history for better caching/context
          submodules: recursive

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

#      - name: Check for changes in Spack Base Dockerfile
#        uses: dorny/paths-filter@v3
#        id: filter
#        with:
#          filters: |
#            base:
#              - 'docker/Dockerfile-Spack-Base'

      # 5. Build and push Spack Base image
      - name: Spack Base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-Spack-Base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.base_project_name }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catchem-spack-base:latest
          cache-to: |
            type=inline

      # 6. Build and push CATChem image
      - name: CATChem image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ inputs.base_project_name }}:${{ inputs.tag }}
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.project_name }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ inputs.project_name }}:${{ inputs.cache_tag }}
          cache-to: |
            type=inline
