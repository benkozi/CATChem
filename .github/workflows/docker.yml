name: Build, Test and Push Docker Image

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to use for the Docker image'
        required: true
        type: string
      cache_tag:
        description: 'The tag to use for cache-from'
        required: true
        type: string
      is_release:
        description: 'Whether this is a release build'
        required: false
        type: boolean
        default: false
    secrets:
      base_project_name:
        description: 'The base project name'
        required: true
      project_name:
        description: 'The project name'
        required: true
      DOCKER_USERNAME:
        description: 'Docker Hub username'
        required: true
      DOCKERHUB_TOKEN:
        description: 'Docker Hub token'
        required: true

jobs:
  build-test-push:
#    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history for better caching/context
          submodules: recursive

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for changes in Spack Base Dockerfile
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'docker/Dockerfile-Spack-Base'

      # 5. Build and push Spack Base image
      - name: Build and push Spack Base image
        if: steps.filter.outputs.base == 'true' || inputs.is_release == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-Spack-Base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.base_project_name }}:${{ inputs.tag }}
          #cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_BASE_PROJECT_NAME }}:latest
          cache-from: type=registry,ref=deckyfre/catchem-spack-base:latest
          cache-to: type=inline

      # 6. Build and push production image
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.base_project_name }}:${{ inputs.tag }}
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.project_name }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ secrets.project_name }}:${{ inputs.cache_tag }}
          cache-to: type=inline

